[defaults]
# Points to your inventory file so you don't have to type '-i inventory.yml' every time
inventory = ./inventory.yml

# Where Ansible looks for roles (useful as your project grows)
#roles_path = ./roles

# Prevents the "Are you sure you want to connect" prompt for new SSH hosts (great for labs)
host_key_checking = False

# Keeps the output clean by hiding "skipped" tasks
#display_skipped_hosts = False

# Automatically handles Python interpreter discovery (common on macOS)
interpreter_python = auto_silent

# Increases the speed of task execution by keeping the connection open
[ssh_connection]
#pipelining = True